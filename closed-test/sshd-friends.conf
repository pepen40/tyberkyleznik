# Operator installs only on the separate test host. Validate with sshd -t/-T.
# Friends are members of this group; never add the operator to it.
Match Group pepen-test-forward
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8080
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    GatewayPorts no
    ForceCommand /bin/false
Match all
