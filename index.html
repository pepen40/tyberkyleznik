<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>пепен клуб: экономика</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #008080; color: #000; font-family: "Times New Roman", Times, serif; text-align: center; margin: 0; padding: 20px; }
        h1 { font-size: 40px; margin-top: 10px; margin-bottom: 20px; animation: rainbow-colors 1.5s infinite step-end; }
        @keyframes rainbow-colors { 0% { color: #FF0000; } 17% { color: #FF7F00; } 33% { color: #FFFF00; } 50% { color: #00FF00; } 67% { color: #0000FF; } 83% { color: #4B0082; } 100% { color: #8B00FF; } }
        
        .panel { background-color: #c0c0c0; border: 4px outset #ffffff; padding: 20px; width: 90%; max-width: 600px; margin: 0 auto; text-align: center; }
        
        input[type="text"], input[type="password"] { font-family: "Courier New", Courier, monospace; font-size: 18px; padding: 5px; margin: 5px 0; border: 3px inset #ffffff; width: 80%; background-color: #fff; }
        button { font-family: "Courier New", Courier, monospace; font-size: 18px; font-weight: bold; background-color: #c0c0c0; border: 4px outset #ffffff; padding: 5px 15px; margin-top: 10px; cursor: pointer; }
        button:active { border: 4px inset #ffffff; }
        .hidden { display: none !important; }

        #status { font-size: 24px; font-weight: bold; color: #00FF00; background-color: #000080; border: 3px inset #c0c0c0; padding: 10px; margin-bottom: 20px; cursor: pointer; }
        
        table { margin: 0 auto; border-collapse: separate; border-spacing: 10px; }
        .pad { width: 100px; height: 100px; background-color: #c0c0c0; border: 5px outset #ffffff; cursor: pointer; }
        .pad:active { border: 5px inset #ffffff; }
        .pad.active { background-color: #FF0000; border: 5px inset #ffffff; }
        .pad img { width: 100%; height: 100%; object-fit: cover; }
        .pad.disabled { opacity: 0.2; pointer-events: none; }

        .nav-bar { margin-bottom: 20px; background-color: #000080; padding: 10px; border: 3px outset #ffffff; }
        .nav-bar button { margin: 5px; background-color: #c0c0c0; font-size: 16px; }
        
        .shop-item { background-color: #fff; border: 2px solid #000; padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; text-align: left;}
        .inv-item { background-color: #fff; border: 2px solid #000; padding: 10px; margin: 5px 0; text-align: left; display: flex; justify-content: space-between; align-items: center;}

        .rarity-Обычное { color: gray; font-weight: bold; }
        .rarity-Редкое { color: blue; font-weight: bold; }
        .rarity-Эпическое { color: purple; font-weight: bold; }
        .rarity-Сверхредкое { color: #ff4500; font-weight: bold; }
        .rarity-Легендарное { color: #D4AF37; font-weight: bold; text-shadow: 1px 1px 0 #000; }
        
        /* Обновленная таблица лидеров */
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #fff; border: 3px inset #ffffff; }
        .leaderboard-table th, .leaderboard-table td { border: 1px solid #000; padding: 5px; font-size: 16px; }
        .leaderboard-table th { background-color: #000080; color: #fff; font-size: 14px;}

        #auth-msg { color: red; font-weight: bold; height: 20px; }
        .top-info { font-size: 18px; font-weight: bold; margin-bottom: 15px; background: #000; color: #0f0; padding: 5px; font-family: monospace; }

        #profile-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #c0c0c0; border: 4px outset #fff; padding: 20px; width: 80%; max-width: 400px; text-align: left; }
        .modal-content h3 { margin-top: 0; }
    </style>
</head>
<body>

    <div id="auth-screen" class="panel">
        <h1>добро пожаловать</h1>
        <input type="text" id="username" placeholder="Твой ник">
        <input type="password" id="password" placeholder="Пароль">
        <br>
        <button onclick="register()">Зарегаться</button>
        <button onclick="login()">Войти</button>
        <p id="auth-msg"></p>
    </div>

    <div id="main-screen" class="hidden">
        <div class="top-info">
            Игрок: <span id="ui-username" style="color: #fff;"></span> | 
            Бабки: <span id="ui-coins" style="color: yellow;"></span> | 
            Очки вещей: <span id="ui-item-points" style="color: magenta;"></span> |
            Рекорд: <span id="ui-highscore" style="color: cyan;"></span>
        </div>

        <div class="nav-bar">
            <button onclick="switchTab('game')">Играть</button>
            <button onclick="switchTab('cases')">Кейсы</button>
            <button onclick="switchTab('inventory')">Инвентарь</button>
            <button onclick="switchTab('market')">Рынок</button>
            <button onclick="switchTab('leaderboard')">Зал славы</button>
        </div>

        <div id="tab-game" class="panel">
            <h2>мини игра "пидоры и тугарин змей"</h2>
            <div id="status">привет ножми</div>
            <table>
                <tr>
                    <td><div class="pad disabled" data-id="1"><img src="IMG_3544.jpeg" alt="1"></div></td>
                    <td><div class="pad disabled" data-id="2"><img src="IMG_3545.jpeg" alt="2"></div></td>
                </tr>
                <tr>
                    <td><div class="pad disabled" data-id="3"><img src="IMG_3546.jpeg" alt="3"></div></td>
                    <td><div class="pad disabled" data-id="4"><img src="IMG_3547.jpeg" alt="4"></div></td>
                </tr>
            </table>
            <button id="restart-btn" class="hidden" style="margin-top: 20px;">Рестарт</button>
        </div>

        <div id="tab-cases" class="panel hidden">
            <h2>Кейс с хуйнёй</h2>
            <div class="shop-item">
                <div><b>Стандартный кейс</b><br><small>Шанс выбить Apostol: 3%</small></div>
                <div><button onclick="openCase(100)">Открыть (100 монет)</button></div>
            </div>
            <h3 id="case-result" style="color: red; margin-top: 20px;"></h3>
        </div>

        <div id="tab-inventory" class="panel hidden">
            <h2>Твой склад с хуйнёй</h2>
            <div id="inventory-list"></div>
        </div>

        <div id="tab-market" class="panel hidden">
            <h2>Торговая площадка</h2>
            <div id="market-list" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <div id="tab-leaderboard" class="panel hidden">
            <h2>зал славы</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Игрок</th>
                        <th>Игра</th>
                        <th>Вещи</th>
                        <th>Общий</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <div id="profile-modal" class="hidden">
        <div class="modal-content">
            <h3 id="prof-name">Игрок</h3>
            <p id="prof-stats"></p>
            <div id="prof-inventory" style="max-height: 200px; overflow-y: auto;"></div>
            <button onclick="closeProfile()" style="width: 100%; margin-top: 15px; background: #ffcccb;">Закрыть</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zfvinbamwavibnhmfwnz.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmdmluYmFtd2F2aWJuaG1md256Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODE2MjAsImV4cCI6MjEwODQ1NzYyMH0.FT5tlKgLUCrFs0zzY-BGimCmU9qNZmIzMW8LyysMmgE';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const EDGE_FUNCTION_NAME = 'award-coins'; 

        let currentUser = null;
        let currentHighScore = 0;
        let currentCoins = 0;
        let currentItemPoints = 0;
        let currentInventory = []; 

        async function register() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            if (!u || !p) { msg.textContent = "Заполни поля."; return; }
            const { data: existing } = await supabaseClient.from('players').select('username').eq('username', u);
            if (existing && existing.length > 0) { msg.textContent = "Ник занят."; return; }
            
            const { error } = await supabaseClient.from('players').insert([{ username: u, password: p, max_score: 0, coins: 200, inventory: [], item_points: 0 }]);
            if (error) msg.textContent = "Ошибка: " + error.message;
            else { msg.style.color = "green"; msg.textContent = "Успех! Тебе начислено 200 монет. Жми Войти."; }
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            if (!u || !p) { msg.textContent = "Заполни поля."; return; }
            const { data, error } = await supabaseClient.from('players').select('*').eq('username', u).eq('password', p).single();
            if (error || !data) { msg.textContent = "Неверный ник или пароль."; }
            else {
                currentUser = data.username;
                currentHighScore = data.max_score;
                currentCoins = data.coins || 0;
                currentInventory = data.inventory || [];
                currentItemPoints = data.item_points || 0;
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                updateUI();
                resetGame();
                switchTab('game');
            }
        }

        function updateUI() {
            document.getElementById('ui-username').textContent = currentUser;
            document.getElementById('ui-highscore').textContent = currentHighScore;
            document.getElementById('ui-coins').textContent = currentCoins;
            document.getElementById('ui-item-points').textContent = currentItemPoints;
        }

        function switchTab(tab) {
            ['game', 'cases', 'inventory', 'market', 'leaderboard'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            if (tab === 'inventory') renderInventory();
            if (tab === 'market') renderMarket();
            if (tab === 'leaderboard') renderLeaderboard();
        }

        async function openCase(price) {
            document.getElementById('case-result').textContent = "Крутим барабан...";
            const { data, error } = await supabaseClient.functions.invoke(EDGE_FUNCTION_NAME, {
                body: { action: 'open_case', username: currentUser, data: { price: price } }
            });
            
            if (error || data.error) {
                document.getElementById('case-result').textContent = "Ошибка: " + (error ? error.message : data.error);
            } else {
                currentCoins = data.newCoins;
                currentInventory = data.newInventory;
                currentItemPoints = data.newItemPoints;
                updateUI();
                document.getElementById('case-result').innerHTML = data.message;
            }
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            if (currentInventory.length === 0) { list.innerHTML = '<p>Пусто.</p>'; return; }
            currentInventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `
                    <div><span class="rarity-${item.rarity}">${item.name}</span> <small>(+${item.points} очков)</small></div>
                    <div><button onclick="sellItem(${index})" style="background-color: #90ee90; font-size: 14px;">Выставить</button></div>
                `;
                list.appendChild(div);
            });
        }

        async function sellItem(index) {
            const item = currentInventory[index];
            const price = prompt(`За сколько монет продать "${item.name}"?`, 50);
            if (!price || isNaN(price) || price <= 0) return;

            const { data, error } = await supabaseClient.functions.invoke(EDGE_FUNCTION_NAME, {
                body: { action: 'sell_item', username: currentUser, data: { item: item, price: parseInt(price) } }
            });

            if (error || data.error) {
                alert("Ошибка: " + (error ? error.message : data.error));
            } else {
                currentInventory = data.newInventory;
                currentItemPoints = data.newItemPoints;
                updateUI();
                renderInventory();
                alert("Выставлено на рынок!");
            }
        }

        async function renderMarket() {
            const list = document.getElementById('market-list');
            list.innerHTML = 'Загрузка...';
            
            const { data, error } = await supabaseClient.from('marketplace').select('*').order('id', { ascending: false });
            if (error) { list.innerHTML = 'Ошибка'; return; }
            list.innerHTML = '';
            if (data.length === 0) { list.innerHTML = '<p>Рынок пуст.</p>'; return; }

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                
                let actionBtn = '';
                if (item.seller === currentUser) {
                    actionBtn = `<button disabled style="background-color: #ccc; font-size: 14px;">Твой лот</button>`;
                } else {
                    actionBtn = `<button onclick="buyItem(${item.id})" style="background-color: #90ee90; font-size: 14px;">Купить (${item.price})</button>`;
                }

                div.innerHTML = `
                    <div>
                        <b class="rarity-${item.rarity}">${item.item_name}</b> <small>(+${item.points} очков)</small><br>
                        <small>Продавец: ${item.seller}</small>
                    </div>
                    <div>${actionBtn}</div>
                `;
                list.appendChild(div);
            });
        }

        async function buyItem(listing_id) {
            if (!confirm("Точно купить этот предмет?")) return;

            const { data, error } = await supabaseClient.functions.invoke(EDGE_FUNCTION_NAME, {
                body: { action: 'buy_item', username: currentUser, data: { listing_id: listing_id } }
            });

            if (error || data.error) {
                alert("Ошибка: " + (error ? error.message : data.error));
            } else {
                currentCoins = data.newCoins;
                currentInventory = data.newInventory;
                currentItemPoints = data.newItemPoints;
                updateUI();
                renderMarket();
                alert("Успешно куплено!");
            }
        }

        // ==== ОБНОВЛЕННЫЙ ЛИДЕРБОРД ====
        async function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="6">Загрузка...</td></tr>';
            
            // Берем всех игроков
            const { data, error } = await supabaseClient.from('players').select('username, max_score, item_points');
            if (error) { tbody.innerHTML = '<tr><td colspan="6">Ошибка загрузки</td></tr>'; return; }
            
            // Считаем общий счет и сортируем
            let sortedData = data.map(user => {
                let gameScore = user.max_score || 0;
                let itemScore = user.item_points || 0;
                return { 
                    username: user.username, 
                    gameScore: gameScore, 
                    itemScore: itemScore, 
                    totalScore: gameScore + itemScore 
                };
            }).sort((a, b) => b.totalScore - a.totalScore).slice(0, 10); // Топ 10

            tbody.innerHTML = ''; 
            sortedData.forEach((user, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${user.username}</td>
                    <td>${user.gameScore}</td>
                    <td style="color: purple; font-weight: bold;">${user.itemScore}</td>
                    <td style="font-size: 18px;"><b>${user.totalScore}</b></td>
                    <td><button onclick="viewProfile('${user.username}')" style="font-size: 12px; padding: 2px 5px; margin:0;">Смотреть</button></td>
                `;
                if (user.username === currentUser) tr.style.backgroundColor = '#FFFF00';
                tbody.appendChild(tr);
            });
        }

        async function viewProfile(username) {
            const modal = document.getElementById('profile-modal');
            const nameEl = document.getElementById('prof-name');
            const statsEl = document.getElementById('prof-stats');
            const invEl = document.getElementById('prof-inventory');
            
            nameEl.textContent = "Профиль: " + username;
            statsEl.textContent = "Загрузка...";
            invEl.innerHTML = '';
            modal.classList.remove('hidden');

            const { data, error } = await supabaseClient.from('players').select('*').eq('username', username).single();
            if (error || !data) { statsEl.textContent = "Ошибка."; return; }

            statsEl.innerHTML = `
                Рекорд игры: <b>${data.max_score || 0}</b><br>
                Очки предметов: <b style="color:purple;">${data.item_points || 0}</b><br>
                <hr>
                <b>Общий счет: ${(data.max_score || 0) + (data.item_points || 0)}</b>
            `;

            let inv = data.inventory || [];
            if (inv.length === 0) invEl.innerHTML = "<p>Инвентарь пуст.</p>";
            else {
                inv.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inv-item';
                    div.innerHTML = `<span class="rarity-${item.rarity}">${item.name}</span> <small>(+${item.points})</small>`;
                    invEl.appendChild(div);
                });
            }
        }

        function closeProfile() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        // ==== ИГРА ====
        const pads = document.querySelectorAll('.pad');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const frequencies = { '1': 200, '2': 300, '3': 400, '4': 500 }; 

        let gameSequence = [], playerSequence = [], level = 1, maxPads = 1;
        let isPlayingSequence = false, canClick = false, gameStarted = false;
        let totalClicks = 0; 

        function playSound(id) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(frequencies[id], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            const pad = document.querySelector(`.pad[data-id="${id}"]`);
            if(pad) { pad.classList.add('active'); setTimeout(() => pad.classList.remove('active'), 300); }
        }

        function resetGame() {
            gameSequence = []; level = 1; maxPads = 1; gameStarted = false;
            restartBtn.classList.add('hidden');
            statusText.textContent = "привет ножми"; statusText.style.color = "#00FF00";
            pads.forEach(p => p.classList.add('disabled'));
            updateActivePads();
        }

        function startGame() {
            gameStarted = true; gameSequence = []; level = 1; maxPads = 1;
            totalClicks = 0; 
            restartBtn.classList.add('hidden'); updateActivePads(); nextRound();
        }

        function updateActivePads() {
            pads.forEach(p => {
                const id = parseInt(p.dataset.id);
                if (id <= maxPads) p.classList.remove('disabled'); else p.classList.add('disabled');
            });
        }

        function nextRound() {
            playerSequence = []; statusText.textContent = "ЗАПОМИНАЙТЕ...";
            if (level > 1 && level % 2 === 0 && maxPads < 4) { maxPads++; updateActivePads(); }
            const randomId = Math.floor(Math.random() * maxPads) + 1;
            gameSequence.push(randomId.toString());
            setTimeout(playSequence, 500);
        }

        function playSequence() {
            isPlayingSequence = true; canClick = false;
            gameSequence.forEach((id, index) => {
                setTimeout(() => {
                    playSound(id);
                    if (index === gameSequence.length - 1) {
                        setTimeout(() => { isPlayingSequence = false; canClick = true; statusText.textContent = "ВАШ ХОД!"; }, 400);
                    }
                }, index * 600);
            });
        }

        async function handlePadClick(e) {
            if (!canClick || isPlayingSequence || !gameStarted) return;
            const id = e.currentTarget.dataset.id;
            playSound(id); playerSequence.push(id);

            const currentStep = playerSequence.length - 1;
            if (playerSequence[currentStep] !== gameSequence[currentStep]) {
                canClick = false; gameStarted = false;
                statusText.textContent = "ОШИБКА!"; statusText.style.color = "#FF0000";
                
                let currentScore = level - 1;
                
                const { data, error } = await supabaseClient.functions.invoke(EDGE_FUNCTION_NAME, {
                    body: { action: 'score', username: currentUser, data: { score: currentScore, clicks: totalClicks } }
                });

                if (!error && data.success) {
                    currentCoins = data.newCoins;
                    if (currentScore > currentHighScore) currentHighScore = currentScore;
                    updateUI();
                    statusText.textContent += ` (Заработано: ${totalClicks * 16} монет)`;
                }

                const osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1);
                osc.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1);
                restartBtn.classList.remove('hidden');
                return;
            }

            totalClicks++; 
            currentCoins += 16; 
            updateUI();

            if (playerSequence.length === gameSequence.length) {
                canClick = false; level++;
                statusText.textContent = `УРОВЕНЬ ${level} ПРОЙДЕН!`;
                setTimeout(nextRound, 1500);
            }
        }

        pads.forEach(pad => pad.addEventListener('click', handlePadClick));
        restartBtn.addEventListener('click', startGame);
        statusText.addEventListener('click', () => { if (!gameStarted) startGame(); });
    </script>
</body>
</html>
