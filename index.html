<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>мой поющий apostol</title>
    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #008080;
            color: #000;
            font-family: "Times New Roman", Times, serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-top: 10px;
            margin-bottom: 20px;
            animation: rainbow-colors 1.5s infinite step-end;
        }

        @keyframes rainbow-colors {
            0%   { color: #FF0000; }
            17%  { color: #FF7F00; }
            33%  { color: #FFFF00; }
            50%  { color: #00FF00; }
            67%  { color: #0000FF; }
            83%  { color: #4B0082; }
            100% { color: #8B00FF; }
        }

        .panel {
            background-color: #c0c0c0;
            border: 4px outset #ffffff;
            padding: 20px;
            width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        input[type="text"], input[type="password"] {
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            padding: 5px;
            margin: 5px 0;
            border: 3px inset #ffffff;
            width: 80%;
            background-color: #fff;
        }

        button {
            font-family: "Courier New", Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            background-color: #c0c0c0;
            border: 4px outset #ffffff;
            padding: 5px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        button:active { border: 4px inset #ffffff; }
        .hidden { display: none !important; }

        #status {
            font-size: 24px;
            font-weight: bold;
            color: #00FF00;
            background-color: #000080;
            border: 3px inset #c0c0c0;
            padding: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        table { margin: 0 auto; border-collapse: separate; border-spacing: 15px; }

        .pad {
            width: 100px;
            height: 100px;
            background-color: #c0c0c0;
            border: 5px outset #ffffff;
            cursor: pointer;
        }

        .pad:active { border: 5px inset #ffffff; }
        .pad.active { background-color: #FF0000; border: 5px inset #ffffff; }
        .pad img { width: 100%; height: 100%; object-fit: cover; }
        .pad.disabled { opacity: 0.2; pointer-events: none; }

        #leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            border: 3px inset #ffffff;
        }
        #leaderboard-table th, #leaderboard-table td {
            border: 1px solid #000;
            padding: 8px;
            font-size: 18px;
        }
        #leaderboard-table th { background-color: #000080; color: #fff; }
        
        #auth-msg { color: red; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-screen" class="panel">
        <h1>добро пожаловать</h1>
        <input type="text" id="username" placeholder="Твой ник">
        <input type="password" id="password" placeholder="Пароль">
        <br>
        <button onclick="register()">Зарегаться</button>
        <button onclick="login()">Войти</button>
        <p id="auth-msg"></p>
    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="game-screen" class="hidden">
        <h1>мини игра "пидоры и тугарин змей" </h1>
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">
            Игрок: <span id="ui-username" style="color: blue;"></span> | 
            Рекорд: <span id="ui-highscore" style="color: green;"></span>
        </div>
        
        <div id="status">привет ножми</div>
        
        <table>
            <tr>
                <!-- ТУТ ПОМЕНЯЛ НА ТВОИ JPEG -->
                <td><div class="pad disabled" data-id="1"><img src="IMG_3544.jpeg" alt="1"></div></td>
                <td><div class="pad disabled" data-id="2"><img src="IMG_3545.jpeg" alt="2"></div></td>
            </tr>
            <tr>
                <!-- И ТУТ ПОМЕНЯЛ НА ТВОИ JPEG -->
                <td><div class="pad disabled" data-id="3"><img src="IMG_3546.jpeg" alt="3"></div></td>
                <td><div class="pad disabled" data-id="4"><img src="IMG_3547.jpeg" alt="4"></div></td>
            </tr>
        </table>

        <button id="restart-btn" class="hidden" style="margin-top: 20px;">Рестарт</button>
        <button onclick="showLeaderboard()" style="margin-top: 20px; background-color: #FFD700;">Таблица лидеров</button>
    </div>

    <!-- ЭКРАН ЛИДЕРБОРДА -->
    <div id="leaderboard-screen" class="panel hidden">
        <h1>зал славы. лушчие игроки в нарды</h1>
        <table id="leaderboard-table">
            <thead>
                <tr><th>Место</th><th>Игрок</th><th>Очки</th></tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Сюда упадут данные с сервера -->
            </tbody>
        </table>
        <button onclick="backToGame()" style="margin-top: 20px;">Назад в игру</button>
    </div>

    <script>
        // ТВОИ КЛЮЧИ ИЗ ЗИМБАБВЕ
        const SUPABASE_URL = 'https://zfvinbamwavibnhmfwnz.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmdmluYmFtd2F2aWJuaG1md256Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODE2MjAsImV4cCI6MjEwODQ1NzYyMH0.FT5tlKgLUCrFs0zzY-BGimCmU9qNZmIzMW8LyysMmgE';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentHighScore = 0;

        // ===== СИСТЕМА АВТОРИЗАЦИИ =====
        async function register() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');

            if (!u || !p) {
                msg.style.color = "red";
                msg.textContent = "Пожалуйста, заполните все поля.";
                return;
            }

            msg.style.color = "#000080";
            msg.textContent = "Загрузка...";

            const { data: existing } = await supabaseClient
                .from('players')
                .select('username')
                .eq('username', u);

            if (existing && existing.length > 0) {
                msg.style.color = "red";
                msg.textContent = "поцан, этот ник уже занят.";
                return;
            }

            const { error } = await supabaseClient
                .from('players')
                .insert([{ username: u, password: p, max_score: 0 }]);

            if (error) {
                msg.style.color = "red";
                msg.textContent = "Ошибка сервера: " + error.message;
            } else {
                msg.style.color = "green";
                msg.textContent = "Успешная регистрация! Теперь нажмите 'Войти'.";
            }
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');

            if (!u || !p) {
                msg.style.color = "red";
                msg.textContent = "Пожалуйста, заполните все поля.";
                return;
            }

            const { data, error } = await supabaseClient
                .from('players')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .single();

            if (error || !data) {
                msg.style.color = "red";
                msg.textContent = "Неверный ник или пароль.";
            } else {
                currentUser = data.username;
                currentHighScore = data.max_score;
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                updateUI();
                resetGame();
            }
        }

        function updateUI() {
            document.getElementById('ui-username').textContent = currentUser;
            document.getElementById('ui-highscore').textContent = currentHighScore;
        }

        // ===== ЛИДЕРБОРД =====
        async function showLeaderboard() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('leaderboard-screen').classList.remove('hidden');
            
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="3">Загрузка...</td></tr>';

            const { data, error } = await supabaseClient
                .from('players')
                .select('username, max_score')
                .order('max_score', { ascending: false })
                .limit(10);

            if (error) {
                tbody.innerHTML = '<tr><td colspan="3">Ошибка загрузки данных: ' + error.message + '</td></tr>';
                return;
            }

            tbody.innerHTML = ''; 

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">Пока нет результатов. Станьте первым!</td></tr>';
                return;
            }

            data.forEach((user, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${index + 1}</td><td>${user.username}</td><td>${user.max_score}</td>`;
                if (user.username === currentUser) tr.style.backgroundColor = '#FFFF00';
                tbody.appendChild(tr);
            });
        }

        function backToGame() {
            document.getElementById('leaderboard-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        }

        // ===== САМА ИГРА =====
        const pads = document.querySelectorAll('.pad');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const frequencies = { '1': 200, '2': 300, '3': 400, '4': 500 }; 

        let gameSequence = [];
        let playerSequence = [];
        let level = 1;
        let maxPads = 1;
        let isPlayingSequence = false;
        let canClick = false;
        let gameStarted = false;

        function playSound(id) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(frequencies[id], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);

            const pad = document.querySelector(`.pad[data-id="${id}"]`);
            if(pad) {
                pad.classList.add('active');
                setTimeout(() => pad.classList.remove('active'), 300);
            }
        }

        function resetGame() {
            gameSequence = [];
            level = 1;
            maxPads = 1;
            gameStarted = false;
            restartBtn.classList.add('hidden');
            statusText.textContent = "НАЖМИ ЧТОБЫ НАЧАТЬ";
            statusText.style.color = "#00FF00";
            pads.forEach(p => p.classList.add('disabled'));
        }

        function startGame() {
            gameStarted = true;
            gameSequence = [];
            level = 1;
            maxPads = 1;
            restartBtn.classList.add('hidden');
            updateActivePads();
            nextRound();
        }

        function updateActivePads() {
            pads.forEach(p => {
                const id = parseInt(p.dataset.id);
                if (id <= maxPads) {
                    p.classList.remove('disabled');
                } else {
                    p.classList.add('disabled');
                }
            });
        }

        function nextRound() {
            playerSequence = [];
            statusText.textContent = "ЗАПОМИНАЙТЕ...";
            
            if (level > 1) {
                if (level % 2 === 0 && maxPads < 4) {
                    maxPads++; 
                    updateActivePads();
                }
            }
            const randomId = Math.floor(Math.random() * maxPads) + 1;
            gameSequence.push(randomId.toString());
            setTimeout(playSequence, 500);
        }

        function playSequence() {
            isPlayingSequence = true;
            canClick = false;
            gameSequence.forEach((id, index) => {
                setTimeout(() => {
                    playSound(id);
                    if (index === gameSequence.length - 1) {
                        setTimeout(() => {
                            isPlayingSequence = false;
                            canClick = true;
                            statusText.textContent = "ВАШ ХОД!";
                        }, 400);
                    }
                }, index * 600);
            });
        }

        async function handlePadClick(e) {
            if (!canClick || isPlayingSequence || !gameStarted) return;

            const id = e.currentTarget.dataset.id;
            playSound(id);
            playerSequence.push(id);

            const currentStep = playerSequence.length - 1;
            if (playerSequence[currentStep] !== gameSequence[currentStep]) {
                // ПРОИГРЫШ
                canClick = false;
                gameStarted = false;
                statusText.textContent = "ОШИБКА! ВЫ ПРОИГРАЛИ.";
                statusText.style.color = "#FF0000";
                
                let currentScore = level - 1;
                
                if (currentScore > currentHighScore) {
                    currentHighScore = currentScore;
                    updateUI();
                    statusText.textContent += " (НОВЫЙ РЕКОРД!)";
                    
                    await supabaseClient
                        .from('players')
                        .update({ max_score: currentHighScore })
                        .eq('username', currentUser);
                }

                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1);
                osc.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1);

                restartBtn.classList.remove('hidden');
                return;
            }

            if (playerSequence.length === gameSequence.length) {
                canClick = false;
                level++;
                statusText.textContent = `УРОВЕНЬ ${level} ПРОЙДЕН!`;
                setTimeout(nextRound, 1500);
            }
        }

        pads.forEach(pad => pad.addEventListener('click', handlePadClick));
        restartBtn.addEventListener('click', startGame);
        statusText.addEventListener('click', () => {
            if (!gameStarted) startGame();
        });

    </script>
</body>
</html>
