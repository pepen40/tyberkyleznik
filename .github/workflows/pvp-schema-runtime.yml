name: PvP schema runtime tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261102120000_create_pvp_match_storage.sql
      - supabase/migrations/20261103100000_add_rpg_pvp_server_build.sql
      - supabase/migrations/20261103110000_rpg_pvp_match_lifecycle.sql
      - supabase/migrations/20261103120000_rpg_pvp_atomic_actions.sql
      - supabase/migrations/20261103130000_rpg_pvp_waiting_cancel.sql
      - supabase/migrations/20261103140000_rpg_pvp_turn_timeout.sql
      - supabase/tests/database/pvp_match_storage_test.sql
      - supabase/tests/database/rpg_pvp_server_build_test.sql
      - supabase/tests/database/rpg_pvp_match_lifecycle_test.sql
      - supabase/tests/database/rpg_pvp_atomic_actions_test.sql
      - supabase/tests/database/rpg_pvp_gameplay_test.sql
      - supabase/tests/database/rpg_pvp_items_test.sql
      - supabase/tests/database/rpg_pvp_combat_rules_test.sql
      - supabase/functions/rpg-pvp/index.ts
      - supabase/functions/award-coins/index.ts
      - script.js
      - .github/pvp-schema-test/preflight.sql
      - .github/pvp-schema-test/concurrency.sh
      - .github/workflows/pvp-schema-runtime.yml
  push:
    paths:
      - supabase/migrations/20261102120000_create_pvp_match_storage.sql
      - supabase/migrations/20261103100000_add_rpg_pvp_server_build.sql
      - supabase/migrations/20261103110000_rpg_pvp_match_lifecycle.sql
      - supabase/migrations/20261103120000_rpg_pvp_atomic_actions.sql
      - supabase/migrations/20261103130000_rpg_pvp_waiting_cancel.sql
      - supabase/migrations/20261103140000_rpg_pvp_turn_timeout.sql
      - supabase/tests/database/**
      - supabase/functions/rpg-pvp/index.ts
      - supabase/functions/award-coins/index.ts
      - script.js
      - .github/pvp-schema-test/preflight.sql
      - .github/pvp-schema-test/concurrency.sh
      - .github/workflows/pvp-schema-runtime.yml
  workflow_dispatch:

jobs:
  pvp-schema:
    name: PostgreSQL 17 + local Supabase + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check PvP client and Edge Function syntax
        run: |
          node --check script.js
          deno check supabase/functions/rpg-pvp/index.ts
          deno check supabase/functions/award-coins/index.ts

      - name: Create isolated Supabase test project
        shell: bash
        run: |
          set -euo pipefail

          harness_dir="$RUNNER_TEMP/pvp-schema-supabase"
          mkdir -p "$harness_dir"
          cd "$harness_dir"
          supabase init

          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path("supabase/config.toml")
          contents = config.read_text(encoding="utf-8")
          contents, version_count = re.subn(
              r"(?m)^(\s*major_version\s*=\s*)\d+(\s*)$",
              r"\g<1>17\g<2>",
              contents,
          )
          if version_count != 1:
              raise SystemExit(
                  f"Expected exactly one db.major_version entry in {config}, found {version_count}"
              )
          contents, project_count = re.subn(
              r'(?m)^\s*project_id\s*=\s*"[^"]*"\s*$',
              'project_id = "pvp_schema_ci"',
              contents,
          )
          if project_count != 1:
              raise SystemExit(
                  f"Expected exactly one project_id entry in {config}, found {project_count}"
              )
          config.write_text(contents, encoding="utf-8")
          PY

          mkdir -p supabase/migrations supabase/tests/database
          cp "$GITHUB_WORKSPACE/.github/pvp-schema-test/preflight.sql" \
            supabase/migrations/20261102115900_pvp_test_preflight.sql
          for migration in \
            20261102120000_create_pvp_match_storage.sql \
            20261103100000_add_rpg_pvp_server_build.sql \
            20261103110000_rpg_pvp_match_lifecycle.sql \
            20261103120000_rpg_pvp_atomic_actions.sql \
            20261103130000_rpg_pvp_waiting_cancel.sql \
            20261103140000_rpg_pvp_turn_timeout.sql; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$migration" supabase/migrations/
          done
          for test in \
            pvp_match_storage_test.sql \
            rpg_pvp_server_build_test.sql \
            rpg_pvp_match_lifecycle_test.sql \
            rpg_pvp_atomic_actions_test.sql \
            rpg_pvp_gameplay_test.sql \
            rpg_pvp_items_test.sql \
            rpg_pvp_combat_rules_test.sql; do
            cp "$GITHUB_WORKSPACE/supabase/tests/database/$test" supabase/tests/database/
          done

      - name: Start disposable Supabase Auth and Realtime with PostgreSQL
        working-directory: ${{ runner.temp }}/pvp-schema-supabase
        run: >-
          supabase start
          --exclude imgproxy,storage-api,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply only the PvP migration and test harness preflight
        working-directory: ${{ runner.temp }}/pvp-schema-supabase
        run: supabase db reset --local --yes

      - name: Verify concurrent actions serialize and reject stale state
        working-directory: ${{ runner.temp }}/pvp-schema-supabase
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/pvp-schema-test/concurrency.sh"

      - name: Run the PvP pgTAP suite
        working-directory: ${{ runner.temp }}/pvp-schema-supabase
        run: supabase test db --local

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          harness_dir="$RUNNER_TEMP/pvp-schema-supabase"
          if [[ -f "$harness_dir/supabase/config.toml" ]]; then
            supabase --workdir "$harness_dir" stop --no-backup || true
          fi
