name: PvP schema runtime tests
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:
jobs:
  pvp-schema:
    name: Fixture scope / PostgreSQL 17 PvP, pgTAP and concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Install PostgreSQL client (server is supplied by the local stack)
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Prepare fixture scope, without invented migration timestamps
        run: node scripts/ci/run.cjs pvp-prepare bash .github/ci/backend.sh prepare pvp
      - name: Start empty disposable Supabase stack / PostgreSQL 17
        working-directory: ${{ runner.temp }}/site-pvp-supabase
        run: >-
          node "${{ github.workspace }}/scripts/ci/run.cjs" pvp-start supabase start
          --exclude imgproxy,storage-api,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply fixture, then original PvP migration chain
        working-directory: ${{ runner.temp }}/site-pvp-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" pvp-migrations bash "${{ github.workspace }}/.github/ci/backend.sh" apply pvp
      - name: Competing action versions and idempotency
        working-directory: ${{ runner.temp }}/site-pvp-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" pvp-concurrency bash "${{ github.workspace }}/.github/pvp-schema-test/concurrency.sh"
      - name: Admission and deadline under multi-connection lock contention
        working-directory: ${{ runner.temp }}/site-pvp-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" pvp-admission-deadline bash "${{ github.workspace }}/.github/pvp-schema-test/admission-race.sh"
      - name: Run all eight PvP pgTAP suites
        working-directory: ${{ runner.temp }}/site-pvp-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" pvp-pgtap supabase test db --local
      - name: Stop disposable stack
        if: always()
        run: node scripts/ci/run.cjs pvp-stop bash .github/ci/stop-backend.sh pvp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvp-fixture-results
          path: .runtime/ci/safe/
          retention-days: 7
          if-no-files-found: error
