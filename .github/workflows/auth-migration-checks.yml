name: Auth migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/auth-migration]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript syntax
        run: node --check script.js
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/award-coins/index.ts
