name: Auth migration checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/auth-migration]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript syntax
        run: node --check script.js
      - name: Test frontend widgets
        run: node tests/run-frontend-widgets.cjs
      - name: Test RPG async lifecycle
        run: node tests/run-rpg-lifecycle.cjs
      - name: Test online chess lifecycle
        run: node tests/run-online-chess-lifecycle.cjs
      - name: Test chess delivery and reconnect recovery
        run: node tests/run-chess-delivery.cjs
      - name: Test chess invitation delivery
        run: node tests/run-chess-invitations.cjs
      - name: Test PvP callback ownership and retry identity
        run: node tests/run-pvp-callbacks.cjs
      - name: Test invitation authentication boundary
        run: node tests/run-server-invitations.cjs
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/award-coins/index.ts supabase/functions/rpg-pvp/index.ts
      - name: Test PvP error responses
        run: deno test supabase/functions/_shared/pvp-errors.test.ts
      - name: Test atomic PvP action routing
        run: deno test --allow-read=supabase/functions/rpg-pvp/index.ts supabase/functions/_shared/pvp-action-routing.test.ts
      - name: Test RPG invitation delivery protocol
        run: deno test --allow-read=script.js,supabase/functions/award-coins/index.ts supabase/functions/_shared/rpg-invitations.test.ts supabase/functions/_shared/profile-access.test.ts supabase/functions/_shared/reward-policy.test.ts supabase/functions/_shared/marketplace-policy.test.ts
