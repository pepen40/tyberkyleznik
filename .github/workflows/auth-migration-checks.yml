name: Auth migration checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/auth-migration]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript syntax
        run: node --check script.js
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/award-coins/index.ts
      - name: Test RPG invitation delivery protocol
        run: deno test --allow-read=script.js supabase/functions/_shared/rpg-invitations.test.ts
      - name: Test fail-closed reward policy
        run: deno test --allow-read=supabase/functions/award-coins/index.ts supabase/functions/_shared/reward-policy.test.ts
