name: RPG invitation runtime tests
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:
jobs:
  rpg-invitation:
    name: Fixture scope / PostgreSQL 17 Auth, Realtime, Edge and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Prepare fixture scope without copying application SQL yet
        run: node scripts/ci/run.cjs invitation-prepare bash .github/ci/backend.sh prepare invitation
      - name: Start empty disposable PostgreSQL, Auth and Realtime
        working-directory: ${{ runner.temp }}/site-invitation-supabase
        run: >-
          node "${{ github.workspace }}/scripts/ci/run.cjs" invitation-start supabase start
          --exclude imgproxy,storage-api,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Apply fixture before the eight original invitation migrations
        working-directory: ${{ runner.temp }}/site-invitation-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" invitation-migrations bash "${{ github.workspace }}/.github/ci/backend.sh" apply invitation
      - name: Export and mask only disposable local test settings
        working-directory: ${{ runner.temp }}/site-invitation-supabase
        run: node "${{ github.workspace }}/.github/ci/export-local.cjs"
      - name: Run both pgTAP invitation authorization suites
        working-directory: ${{ runner.temp }}/site-invitation-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" invitation-pgtap supabase test db --local
      - name: Serve award-coins with local runtime credentials and verify readiness
        working-directory: ${{ runner.temp }}/site-invitation-supabase
        run: node "${{ github.workspace }}/scripts/ci/run.cjs" invitation-readiness bash "${{ github.workspace }}/.github/ci/serve-invitation.sh"
      - name: Private inbox Auth and Realtime integration
        run: >-
          node scripts/ci/run.cjs invitation-realtime deno test
          --allow-env=RPG_TEST_API_URL,RPG_TEST_ANON_KEY,RPG_TEST_SERVICE_ROLE_KEY
          --allow-net=127.0.0.1,localhost,esm.sh,deno.land
          supabase/functions/_shared/rpg-invitation-realtime.integration.test.ts
      - name: Authenticated invitation lifecycle through the actual local Edge Function
        run: >-
          node scripts/ci/run.cjs invitation-edge deno test
          --allow-env=RPG_TEST_API_URL,RPG_TEST_ANON_KEY,RPG_TEST_SERVICE_ROLE_KEY
          --allow-net=127.0.0.1,localhost,esm.sh,deno.land
          supabase/functions/_shared/rpg-invitation-edge.integration.test.ts
      - name: Stop disposable stack
        if: always()
        run: node scripts/ci/run.cjs invitation-stop bash .github/ci/stop-backend.sh invitation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invitation-fixture-results
          path: .runtime/ci/safe/
          retention-days: 7
          if-no-files-found: error
